<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointment Booking</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; background: #f7f7f7; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    #appointments { margin-top: 20px; background: white; padding: 15px; border-radius: 5px; }
  </style>
</head>
<body>

  <h1>Book an Appointment</h1>

  <h2>Register</h2>
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">
  <button onclick="register()">Register</button>

  <h2>Login</h2>
  <input id="logEmail" placeholder="Email">
  <input id="logPassword" type="password" placeholder="Password">
  <button onclick="login()">Login</button>

  <h2>Create Appointment</h2>
  <label>Select Date</label>
  <input id="date" type="date">

  <label>Select Time</label>
  <input id="time" type="time">

  <label>Description</label>
  <input id="desc" placeholder="Reason for appointment">

  <button onclick="book()">Book Appointment</button>

  <h2>Your Appointments</h2>
  <button onclick="loadAppointments()">Refresh List</button>
  <div id="appointments"></div>

  <script>
    let token = null;

    async function register() {
      await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: regEmail.value,
          password: regPassword.value
        })
      });
      alert("Registered!");
    }

    async function login() {
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: logEmail.value,
          password: logPassword.value
        })
      });
      const data = await res.json();
      token = data.token;
      alert("Logged in!");
    }

    async function book() {
      if (!token) return alert("Please log in first.");

      const dateTime = `${date.value}T${time.value}:00`;

      await fetch("/appointments", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
          date: dateTime,
          description: desc.value
        })
      });

      alert("Appointment booked!");
      loadAppointments();
    }

    async function loadAppointments() {
      if (!token) return alert("Please log in first.");

      const res = await fetch("/appointments", {
        headers: { "Authorization": "Bearer " + token }
      });

      const appts = await res.json();
      const container = document.getElementById("appointments");
      container.innerHTML = "";

      appts.forEach(a => {
        const div = document.createElement("div");
        div.style.marginBottom = "10px";
        div.innerHTML = `<strong>${new Date(a.date).toLocaleString()}</strong><br>${a.description}`;
        container.appendChild(div);
      });
    }
  </script>

</body>
</html>
