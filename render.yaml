services:
  - type: web
    name: consultbook
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: consultbook-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: consultbook-db
    databaseName: consultbook
    user: consultbook
    plan: free
